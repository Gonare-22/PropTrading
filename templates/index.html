<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EMA Strategy Backtest UI</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #07111f, #183a5b);
        color: #f4f7fb;
        margin: 0;
        padding: 24px;
      }
      .card {
        max-width: 980px;
        margin: 0 auto;
        background: rgba(255,255,255,0.08);
        padding: 24px;
        border-radius: 18px;
        box-shadow: 0 14px 60px rgba(0,0,0,0.35);
      }
      h1 { margin-top: 0; }
      .table-container {
        overflow-x: auto;
        margin-top: 16px;
      }
      table.trade-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
        font-size: 13px;
      }
      table.trade-table th,
      table.trade-table td {
        padding: 8px 10px;
        border: 1px solid rgba(255,255,255,0.14);
        text-align: left;
      }
      table.trade-table th {
        background: rgba(255,255,255,0.12);
        font-weight: 700;
        position: sticky;
        top: 0;
      }
      table.trade-table tr.win-row {
        background: rgba(46, 204, 113, 0.15);
      }
      table.trade-table tr.loss-row {
        background: rgba(231, 76, 60, 0.15);
      }
      .pnl-positive { color: #2ecc71; font-weight: 700; }
      .pnl-negative { color: #e74c3c; font-weight: 700; }
      .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); }
      label { display: block; margin-bottom: 6px; font-weight: 600; }
      input, select, button { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #5e7f99; }
      button { background: linear-gradient(135deg,#27ae60,#2ecc71); color: white; font-weight: 700; cursor: pointer; margin-top: 8px; }
      .result { margin-top: 20px; padding: 16px; border-radius: 12px; background: rgba(0,0,0,0.18); }
      .metrics { display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap: 12px; margin-top: 12px; }
      .metric { background: linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.08)); padding: 18px; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
      .metric strong { color: #dffafd; }
      .section-title { margin-top: 24px; color: #c4e9ff; }
      .error { color: #ff6b6b; font-weight: 700; }
      .muted { color: #bcd2e8; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>EMA 20/50/100 Strategy Backtest</h1>
      <p class="muted">Dynamic backend-driven backtest for Indian, US, and Forex markets.</p>
      <form id="backtestForm">
        <div class="grid">
          <div>
            <label>Market</label>
            <select id="market" name="market">
              <option value="india">India</option>
              <option value="us">US</option>
              <option value="forex">Forex</option>
            </select>
          </div>
          <div>
            <label>Symbol</label>
            <select id="symbol" name="symbol"></select>
          </div>
          <div>
            <label>Custom Symbol</label>
            <input type="text" id="custom_symbol" name="custom_symbol" placeholder="Enter custom symbol or leave blank" />
          </div>
          <div>
            <label>Start Date</label>
            <input type="date" id="start_date" name="start_date" value="2024-01-01" />
          </div>
          <div>
            <label>End Date</label>
            <input type="date" id="end_date" name="end_date" value="2024-12-31" />
          </div>
          <div id="interval-group">
            <label>Interval</label>
            <select id="interval" name="interval">
              <option value="1m">1 Minute (max 7 days)</option>
              <option value="5m">5 Minutes (max 60 days)</option>
              <option value="15m">15 Minutes (max 60 days)</option>
              <option value="1h">1 Hour (max 2 years)</option>
              <option value="1d" selected>1 Day (unlimited)</option>
            </select>
          </div>
          <div>
            <label>Data Source</label>
            <select id="data_source" name="data_source">
              <option value="yahoo" selected>Yahoo Finance</option>
              <option value="tweleve_data">Tweleve Data API</option>
              <option value="upload">Upload CSV File</option>
              <option value="alpha_vantage">Alpha Vantage</option>
              <option value="polygon">Polygon.io</option>
            </select>
          </div>
          <div id="file-upload-group" style="display:none;">
            <label>Upload Data File (CSV or Excel)</label>
            <input type="file" id="data_file" name="data_file" accept=".csv,.xlsx,.xls" />
            <small style="color:#bcd2e8;display:block;margin-top:4px;">Supports CSV and Excel. Required columns: Date, Open, High, Low, Close</small>
          </div>
          <div>
            <label>Initial Capital</label>
            <input type="number" id="initial_capital" name="initial_capital" value="100000" />
          </div>
          <div>
            <label>Risk Per Trade (%) <span id="risk-preview" style="color:#2ecc71;font-weight:700;"></span></label>
            <input type="number" id="risk_per_trade" name="risk_per_trade" value="100" min="1" max="100" step="0.5" />
          </div>
          <div id="lot-size-group" style="display:none;">
            <label>Lot Size (Forex)</label>
            <input type="number" id="lot_size" name="lot_size" step="0.01" min="0.01" value="0.10" />
          </div>
        </div>
        <button type="submit">Run Backtest</button>
      </form>
      <div id="results" class="result" style="display:none;"></div>
    </div>

    <script>
      const marketOptions = {{ markets | tojson }};
      const symbolSelect = document.getElementById('symbol');
      const marketSelect = document.getElementById('market');
      const lotSizeGroup = document.getElementById('lot-size-group');
      const dataSourceSelect = document.getElementById('data_source');
      const fileUploadGroup = document.getElementById('file-upload-group');
      const startDateInput = document.getElementById('start_date').parentElement;
      const endDateInput = document.getElementById('end_date').parentElement;
      const intervalGroup = document.getElementById('interval-group');
      
      function populateSymbols() {
        const market = marketSelect.value;
        symbolSelect.innerHTML = '';
        marketOptions[market].forEach(option => {
          const opt = document.createElement('option');
          opt.value = option.value;
          opt.textContent = option.label;
          symbolSelect.appendChild(opt);
        });
        lotSizeGroup.style.display = market === 'forex' ? 'block' : 'none';
      }
      
      marketSelect.addEventListener('change', populateSymbols);
      marketSelect.addEventListener('change', updateRiskPreview);
      
      dataSourceSelect.addEventListener('change', function() {
        const isUpload = dataSourceSelect.value === 'upload';
        fileUploadGroup.style.display = isUpload ? 'block' : 'none';
        startDateInput.style.display = isUpload ? 'none' : 'block';
        endDateInput.style.display = isUpload ? 'none' : 'block';
        intervalGroup.style.display = isUpload ? 'none' : 'block';
      });
      
      populateSymbols();
      
      const riskInput = document.getElementById('risk_per_trade');
      const capitalInput = document.getElementById('initial_capital');
      const riskPreview = document.getElementById('risk-preview');
      
      function updateRiskPreview() {
        const capital = Number(capitalInput.value || 100000);
        const risk = Number(riskInput.value || 100);
        const tradeCapital = capital * (risk / 100);
        const market = document.getElementById('market').value;
        const currency = market === 'india' ? '₹' : '$';
        riskPreview.textContent = `(${currency}${tradeCapital.toLocaleString()} per trade)`;
      }
      
      riskInput.addEventListener('input', updateRiskPreview);
      capitalInput.addEventListener('input', function() {
        updateRiskPreview();
        // Clear previous results when user changes input
        document.getElementById('results').style.display = 'none';
      });
      updateRiskPreview();
      
      document.getElementById('backtestForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const results = document.getElementById('results');
        const formData = new FormData(e.target);
        const dataSource = formData.get('data_source');
        const startDate = formData.get('start_date');
        const endDate = formData.get('end_date');
        
        // Log the form data being sent (for debugging)
        console.log('Form data:', {
          initial_capital: formData.get('initial_capital'),
          risk_per_trade: formData.get('risk_per_trade'),
          market: formData.get('market'),
          data_source: dataSource
        });

        if (dataSource !== 'upload' && startDate && endDate && startDate > endDate) {
          results.style.display = 'block';
          results.innerHTML = '<strong class="error">Error:</strong> Start date must be before end date.';
          return;
        }

        results.style.display = 'block';
        results.innerHTML = '<p>Backtest running...</p>';

        let data;
        try {
          if (dataSource === 'upload') {
            const fileInput = document.getElementById('data_file');
            if (!fileInput.files || fileInput.files.length === 0) {
              data = { success: false, error: 'Please select a file' };
            } else {
              const uploadFormData = new FormData();
              uploadFormData.append('csv_file', fileInput.files[0]);
              uploadFormData.append('market', formData.get('market'));
              uploadFormData.append('initial_capital', formData.get('initial_capital'));
              uploadFormData.append('risk_per_trade', formData.get('risk_per_trade'));
              uploadFormData.append('lot_size', formData.get('lot_size'));
              uploadFormData.append('data_source', 'upload');
              
              const response = await fetch('/run-backtest', {
                method: 'POST',
                body: uploadFormData,
              });
              data = await response.json();
            }
          } else {
            const payload = {
              market: formData.get('market'),
              symbol: formData.get('symbol'),
              custom_symbol: formData.get('custom_symbol'),
              start_date: formData.get('start_date'),
              end_date: formData.get('end_date'),
              interval: formData.get('interval'),
              data_source: formData.get('data_source'),
              initial_capital: Number(formData.get('initial_capital')),
              risk_per_trade: Number(formData.get('risk_per_trade')),
              lot_size: Number(formData.get('lot_size'))
            };
            
            console.log('Sending JSON payload:', payload);
            
            const response = await fetch('/run-backtest', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            data = await response.json();
            console.log('Response data:', data);
          }
        } catch (err) {
          data = { success: false, error: err.message };
          console.error('Error:', err);
        }

        if (!data.success) {
          results.innerHTML = `<strong class="error">Error:</strong> ${data.error}`;
          return;
        }

        const summary = data.summary || {};
        const trades = Array.isArray(data.trade_log) ? data.trade_log : [];
        const tradeRows = trades.map((trade, index) => {
          const isWin = trade.is_win;
          const pnlClass = (trade.pnl || 0) >= 0 ? 'pnl-positive' : 'pnl-negative';
          const rowClass = isWin ? 'win-row' : 'loss-row';
          return `<tr class="${rowClass}">
            <td>${index + 1}</td>
            <td>${trade.entry_signal_bar || ''}</td>
            <td>${trade.entry_time || ''}</td>
            <td>${trade.exit_signal_bar || ''}</td>
            <td>${trade.exit_time || ''}</td>
            <td style="text-transform:uppercase;font-weight:700;">${trade.direction || ''}</td>
            <td><strong>${data.currency}${trade.entry_price != null ? trade.entry_price.toFixed(2) : ''}</strong></td>
            <td><strong>${data.currency}${trade.exit_price != null ? trade.exit_price.toFixed(2) : ''}</strong></td>
            <td class="${pnlClass}"><strong>${data.currency}${trade.pnl != null ? trade.pnl.toFixed(2) : ''}</strong></td>
            <td class="${pnlClass}">${trade.pnl_pct != null ? trade.pnl_pct.toFixed(2) + '%' : ''}</td>
            <td>${data.currency}${trade.equity_after != null ? trade.equity_after.toFixed(2) : ''}</td>
            <td style="font-weight:700;">${isWin ? 'Win' : 'Loss'}</td>
          </tr>`;
        }).join('');

        results.innerHTML = `<h3>${data.symbol_label || data.symbol}</h3>
          <p class="muted">Market: ${data.market_label} | Currency: ${data.currency_code} | Source: ${data.source}</p>
          ${data.date_range ? `<p class="muted">Date Range: ${data.date_range}</p>` : ''}
          ${summary.trades_limited ? `<p class="muted" style="color:#ffd700;">Showing last ${summary.trades_displayed} of ${summary.trades} trades</p>` : ''}
          <div class="metrics">
            <div class="metric"><strong>Trades</strong><br>${summary.trades || 0}</div>
            <div class="metric"><strong>Wins</strong><br>${summary.wins || 0}</div>
            <div class="metric"><strong>Losses</strong><br>${summary.losses || 0}</div>
            <div class="metric"><strong>Accuracy</strong><br>${summary.accuracy || 0}%</div>
            <div class="metric"><strong>Total PnL</strong><br><span class="${(summary.total_pnl || 0) >= 0 ? 'pnl-positive' : 'pnl-negative'}">${data.currency}${(summary.total_pnl || 0).toLocaleString()}</span></div>
            <div class="metric"><strong>Avg PnL</strong><br><span class="${(summary.avg_pnl || 0) >= 0 ? 'pnl-positive' : 'pnl-negative'}">${data.currency}${(summary.avg_pnl || 0).toLocaleString()}</span></div>
            <div class="metric"><strong>Max Drawdown</strong><br>${summary.max_drawdown || 0}%</div>
            <div class="metric"><strong>Ending Equity</strong><br>${data.currency}${(summary.ending_equity || 0).toLocaleString()}</div>
          </div>
          ${trades.length > 0 ? `<div class="section-title">Trade Log</div>
            <div class="table-container">
              <table class="trade-table">
                <thead><tr>
                  <th>#</th><th>Signal Time</th><th>Entry Time</th><th>Exit Signal Time</th>
                  <th>Exit Time</th><th>Direction</th><th>Entry Price</th><th>Exit Price</th>
                  <th>PnL</th><th>PnL %</th><th>Equity After</th><th>Result</th>
                </tr></thead>
                <tbody>${tradeRows}</tbody>
              </table>
            </div>` : '<p class="muted">No trades generated</p>'}`;
      });
    </script>
  </body>
</html>
